<div *ngIf="isLoading" class="lesson-state" role="status">
  <p-progress-spinner></p-progress-spinner>
  <span>Loading lesson…</span>
</div>

<div *ngIf="!isLoading && loadError" class="lesson-state lesson-error" role="alert">
  <p>{{ loadError }}</p>
</div>

<article *ngIf="!isLoading && lesson" class="lesson-detail">
  <p class="lesson-eyebrow">COURSE LESSON</p>
  <h1>{{ lesson.title }}</h1>
  <div class="lesson-meta">
    <span>{{ lesson.duration || 0 }} minutes</span>
    <span *ngIf="lesson.course">{{ lesson.course.title }}</span>
  </div>
  <video *ngIf="lesson.videoUrl" class="lesson-video" controls preload="metadata">
    <source [src]="lesson.videoUrl">
    Your browser does not support embedded video.
  </video>
  <section *ngIf="lesson.content" class="lesson-content">
    <h2>Lesson content</h2>
    <p>{{ lesson.content }}</p>
  </section>
  <p *ngIf="!lesson.videoUrl" class="lesson-state">No video has been added to this lesson yet.</p>
</article>
