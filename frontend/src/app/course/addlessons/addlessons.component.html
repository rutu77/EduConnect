<form class="lesson-form" [formGroup]="lessonForm" (ngSubmit)="onSubmit()">
  <p class="form-intro">Add a lesson to one of your available courses.</p>

  <div *ngIf="courseLoadError" class="form-alert" role="alert">
    <span>{{ courseLoadError }}</span>
    <button type="button" class="text-button" (click)="loadCourses()">Try again</button>
  </div>

  <label for="lesson-course">Course</label>
  <select id="lesson-course" formControlName="courseId" [disabled]="isLoadingCourses || courses.length === 0">
    <option [ngValue]="null" disabled>Select a course</option>
    <option *ngFor="let course of courses" [ngValue]="course.id">{{ course.title }}</option>
  </select>
  <small *ngIf="isLoadingCourses" class="field-hint">Loading your courses…</small>
  <small *ngIf="!isLoadingCourses && !courseLoadError && courses.length === 0" class="field-hint">
    No courses are available. Create a course first.
  </small>

  <label for="lesson-title">Lesson title</label>
  <input id="lesson-title" type="text" formControlName="title" placeholder="e.g. Getting started" required>
  <small *ngIf="lessonForm.controls['title'].touched && lessonForm.controls['title'].invalid" class="field-error">
    Enter a lesson title.
  </small>

  <label for="lesson-video-file">Video file <span class="optional-label">Optional, MP4 or WebM, up to 100 MB</span></label>
  <input id="lesson-video-file" type="file" accept="video/mp4,video/webm" (change)="onVideoSelected($event)">
  <small *ngIf="selectedVideo" class="field-hint">Selected: {{ selectedVideo.name }}</small>

  <label for="lesson-video">Or hosted video URL <span class="optional-label">Optional</span></label>
  <input id="lesson-video" type="url" formControlName="videoUrl" placeholder="https://…">

  <label for="lesson-content">Lesson content <span class="optional-label">Optional, up to 50,000 characters</span></label>
  <textarea id="lesson-content" formControlName="content" rows="8" maxlength="50000"
    placeholder="Add notes or a transcript for this lesson"></textarea>

  <label for="lesson-duration">Duration <span class="optional-label">Minutes</span></label>
  <input id="lesson-duration" type="number" min="0" step="1" formControlName="duration" required>
  <small *ngIf="lessonForm.controls['duration'].touched && lessonForm.controls['duration'].invalid" class="field-error">
    Duration must be zero or more.
  </small>

  <button class="primary-action" type="submit" [disabled]="lessonForm.invalid || isSaving || isLoadingCourses || courses.length === 0">
    {{ isSaving ? 'Adding lesson…' : 'Add lesson' }}
  </button>
</form>
